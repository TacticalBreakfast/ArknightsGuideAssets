name: Fetch JP Gacha Images

# Fires when the JP gacha data sync lands a new/updated banner - same push
# trigger as process_banners.yml. No schedule/poll: the JP asset CDN doesn't
# need polling like the EN mirror did, since this only runs when there's
# actually new banner data to fetch images for.
on:
  push:
    paths:
      - 'excel-jp/gacha_table.json'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Dependencies
        run: pip install requests

      - name: Fetch JP Gacha Images
        env:
          # Without this, ArknightsStudioCLI crashes on ubuntu-latest with
          # "Couldn't find a valid ICU package" - confirmed while testing.
          DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
        run: python3 fetch_jp_gacha_images.py

      - name: Commit and Push Output
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add gacha-jp

          if git diff --staged --quiet; then
            echo "No changes to gacha-jp. Nothing to commit."
          else
            echo "Changes found. Committing and pushing..."
            git commit -m "Fetch JP gacha banner images"

            BRANCH=$(git rev-parse --abbrev-ref HEAD)
            for attempt in 1 2 3 4 5; do
              if git push origin "HEAD:$BRANCH"; then
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "Failed to push after 5 attempts."
                exit 1
              fi
              # Process Banners triggers off the same push and may land its
              # commit first -- both only touch their own output paths, so
              # rebasing onto the new tip and retrying resolves the conflict.
              echo "Push rejected (attempt $attempt/5), rebasing onto latest and retrying..."
              git fetch origin "$BRANCH"
              git rebase "origin/$BRANCH"
            done
          fi
